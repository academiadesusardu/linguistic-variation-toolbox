[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "linguistic-variation-toolbox"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "networkx",
    "matplotlib",
    "pandas",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["."]
include = ["linguistic_variation_toolbox*"]
